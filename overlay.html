<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Givox Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      #alert-video {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <video id="alert-video" playsinline></video>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io("http://localhost:3000");
      const video = document.getElementById("alert-video");

      function hideVideo() {
        video.pause();
        video.removeAttribute("src");
        video.load();
        video.style.display = "none";
      }

      socket.on("nueva-alerta", ({ videoUrl }) => {
        if (!videoUrl) return;

        video.src = videoUrl;
        video.muted = false;
        video.volume = 1;
        video.style.display = "block";
        video.play().catch((err) => {
          console.error("No se pudo reproducir el video:", err);
          hideVideo();
        });
      });

      video.addEventListener("ended", hideVideo);
      video.addEventListener("error", hideVideo);
    </script>
  </body>
</html>
